name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'  # Run release on version tags
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18, 20]
        exclude:
          # 减少 macOS 测试以节省 CI 时间
          - os: macos-latest
            node-version: 18

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Type check
      run: npm run type-check

    - name: Run tests
      run: npm test

    - name: Generate coverage report
      run: npm run test:coverage

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.node-version == '20'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info
        fail_ci_if_error: false

  # Windows 特定测试
  test-windows-hooks:
    name: Test Windows Hook Compatibility
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Check Hook compatibility
      shell: pwsh
      run: |
        Write-Host "Checking Hook compatibility on Windows..."

        # 检测 Git Bash 是否可用
        $bashAvailable = Get-Command bash -ErrorAction SilentlyContinue
        if ($bashAvailable) {
          Write-Host "✅ Git Bash is available"
        } else {
          Write-Host "⚠️ Git Bash is NOT available - some hooks will be skipped"
        }

        # 检测关键 PowerShell 脚本
        $ps1Scripts = Get-ChildItem -Path "hooks" -Filter "*.ps1" -ErrorAction SilentlyContinue
        Write-Host "Found $($ps1Scripts.Count) PowerShell scripts"

        # 验证 PowerShell 通知脚本
        if (Test-Path "hooks/notify-windows.ps1") {
          Write-Host "✅ Windows notification script exists"
          # 语法检查
          $errors = $null
          $tokens = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/hooks/notify-windows.ps1",
            [ref]$tokens,
            [ref]$errors
          )
          if ($null -eq $errors -or $errors.Count -eq 0) {
            Write-Host "✅ notify-windows.ps1 syntax is valid"
          } else {
            Write-Host "❌ notify-windows.ps1 has syntax errors"
            exit 1
          }
        }

        Write-Host "Windows hook compatibility check completed"

    - name: Test CLI on Windows
      shell: pwsh
      run: |
        npm run build
        node dist/scripts/cli.js --version
        Write-Host "✅ CLI runs successfully on Windows"

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint
      continue-on-error: true  # ESLint 可能还没有完全配置

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          lib/
          types/
          !**/node_modules

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test, lint, build]
    # Only run on version tags (e.g., v1.2.1), not on branch pushes
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build

    - name: Publish to npm
      run: npm publish --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    - name: Create GitHub release
      uses: softprops/action-gh-release@v1
      with:
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}